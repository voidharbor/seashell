appId: dev.seashell.app
productName: SeaShell
copyright: Copyright © 2026 SeaShell contributors

directories:
  output: release
  buildResources: build

# MUST stay false. It defaults to TRUE, which runs @electron/rebuild against
# node-pty and compiles a single host-arch binary into node_modules/node-pty/
# build/Release. node-pty's loader PREFERS build/Release over prebuilds/, so a
# "universal" build made on an Intel Mac would ship an x86_64-only PTY layer:
# perfect locally, dead on every Apple Silicon machine. node-pty 1.1.0 is
# Node-API and already ships both darwin prebuilds, so there is nothing to
# rebuild in the first place.
npmRebuild: false

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# node-pty is a native module: its .node binary and its spawn-helper executable
# cannot be read from inside an asar archive, so they must stay unpacked.
asarUnpack:
  - node_modules/node-pty/**/*

afterPack: build/afterPack.cjs

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # node-pty ships ONE single-arch prebuild per platform and picks at runtime by
  # process.arch. @electron/universal walks both slices, sees a Mach-O that is
  # not itself universal sitting identically in each, assumes a packaging bug and
  # aborts. This tells it the single-arch binaries are deliberate. Removing it
  # breaks `--universal` with a "not covered by the x64ArchFiles rule" error.
  # Pairs with npmRebuild:false above — together they are what makes a universal
  # build produced on an Intel host actually work on Apple Silicon.
  x64ArchFiles: "**/node-pty/prebuilds/**"
  target:
    - target: dir
      arch: [x64]
  # Lets macOS keep this on the integrated GPU. On a dual-GPU 2019 MBP,
  # creating a WebGL context can otherwise promote the machine to the discrete
  # Radeon and pin it there, costing 10-15W and provoking thermal throttling.
  extendInfo:
    NSSupportsAutomaticGraphicsSwitching: true
    NSHighResolutionCapable: true
  # Unsigned local build. Distribution requires signing + notarization;
  # arm64 in particular will not launch without at least an ad-hoc signature.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

# Windows. Built from macOS, which works only because node-pty 1.1.0 ships
# Node-API prebuilds for win32-x64 and win32-arm64 — there is no Windows
# toolchain here and nothing gets compiled. `npmRebuild: false` above is what
# keeps it that way; a rebuild would drop a *darwin* binary into a Windows
# package and fail on the target machine in a way that looks like the port is
# broken rather than the packaging.
#
# Target is `dir`, not NSIS: an installer needs wine, which is not installed,
# and an unpacked folder is what a USB hand-off wants anyway.
#
# READ src/main/platform/win32.ts BEFORE TRUSTING THIS BUILD. It reports
# `verifiedKill: false` because Windows has no signals or process groups and
# node-pty does not expose Job Objects — closing a pane terminates ordinary
# children, but a detached process survives and nothing counts it. That is the
# one promise SeaShell exists to keep, so this is a build to TEST, not to ship.
win:
  target:
    - target: dir
      arch: [x64]
