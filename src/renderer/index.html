<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No 'unsafe-inline' anywhere. This is why the viewer builds DOM with
      createElement and element.style rather than innerHTML: a terminal renders
      bytes produced by arbitrary programs, and one injection bug should not
      become script execution.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none';"
    />
    <title>SeaShell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
